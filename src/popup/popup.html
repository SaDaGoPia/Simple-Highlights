<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Highlights Library</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-root">
      <header class="popup-header">
        <h1>Highlights Library</h1>
        <p>Subrayados agrupados por sitio web</p>
      </header>

      <section class="search-wrap" aria-label="Buscar subrayados">
        <input
          id="library-search"
          class="search-input"
          type="search"
          placeholder="Buscar por texto, titulo o sitio"
          autocomplete="off"
        />
        <div class="search-controls">
          <button id="sort-mode-button" class="control-button" type="button" aria-label="Cambiar orden">
            Orden: Relevancia
          </button>
          <button id="group-toggle-button" class="control-button" type="button" aria-pressed="true" aria-label="Agrupar por sitio web">
            Agrupar: Sitio
          </button>
        </div>
        <div class="filter-controls">
          <select id="site-filter" class="site-filter" aria-label="Filtrar por sitio">
            <option value="">Todos los sitios</option>
          </select>
          <div id="color-filter" class="color-filter" role="group" aria-label="Filtrar por color">
            <button type="button" class="color-swatch is-active" data-color-value="" aria-label="Todos los colores" aria-pressed="true">
              <span class="color-swatch-all">Todos</span>
            </button>
          </div>
        </div>
      </section>

      <section class="library-actions">
        <button id="export-button" class="control-button" type="button">Exportar</button>
        <button id="import-button" class="control-button" type="button">Importar</button>
        <input id="import-file-input" type="file" accept="application/json" hidden />
      </section>
      <p id="library-status" class="library-status" aria-live="polite"></p>

      <section id="library-content" class="library-content" aria-live="polite"></section>
    </main>

    <script src="../shared/highlight-library.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
